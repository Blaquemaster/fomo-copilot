# Phase 0 defaults from the build spec, Section 7.
# Placeholders to tune with paper-trading data. They are not trade recommendations.
#
# quiet_hours: "set-by-me", "off", or a 24-hour window "HH:MM-HH:MM" (overnight is allowed).
# Risk sizes stay "set-by-me" until the owner sets a number.
#
# The old 50 bps allowance is retired. Paper uses a selectable FOMO route schedule.
# solana_lowest_fee is the published lowest-fee route. solana_other is 0.50% with a
# $0.95 minimum. fixed_usd charges tx_cost_usd per transaction. FOMO pays Solana
# network and priority fees, so those are not added here.

screen:
  first_screen_delay_s: 90
  rescreen_at_min: [5, 30]
  hard_fail:
    mint_authority_active: true
    freeze_authority_active: true
    transfer_fee_bps_above: 300
    exit_quote_impact_pct_above: 5
    # Entry price impact above this percent is a hard fail. A missing quote stays WATCH.
    # 10 matches the cap reviewed on PR #39.
    entry_impact_pct_above: 10
    # Buy then immediate sell. Above this percent the fill is skipped.
    round_trip_impact_pct_above: 10
    # Wallet-only top 10 share of total supply (bonding curve and pool vaults excluded).
    top10_holders_pct_above: 50
    # Share of create-slot transactions that were bundled buys, not the create itself.
    sniper_bundle_pct_above: 60
    required_source_error: WATCH
  soft:
    top10_holders_pct_warn: 35
    sniper_bundle_pct_warn: 30
    min_liquidity_usd: 15000
    min_unique_makers_1h: 50
  entries:
    # Trench strategy entries need at least this many tracked-wallet buyers. A no-wallet
    # trench coin is a random new launch; random_pass already measures that baseline.
    trench_min_tracked_buyers: 1
    # A tracked wallet counts as a buyer only if it touched at most this many distinct mints
    # in the last day (flip bots buy thousands), is still a net buyer of the coin, and bought
    # within the fresh window.
    wallet_max_mints_per_day: 40
    wallet_buy_fresh_minutes: 60
    # A position may not be larger than this share of pool liquidity.
    max_size_pool_share: 0.01
alerts:
  max_per_hour: 6
  quiet_hours: set-by-me
risk_rules:
  max_position_usd: set-by-me
  max_concurrent_positions: set-by-me
  daily_loss_cutoff_usd: set-by-me
  no_averaging_down: true
paper:
  assumed_slippage_bps: 150
  fee_schedule: solana_lowest_fee
  tx_cost_usd: 0.95
  other_min_usd: 0.95
  other_rate: 0.005
