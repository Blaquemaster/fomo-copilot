name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: none

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check deploy secrets
        id: gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS TELEGRAM_BOT_TOKEN TELEGRAM_ADMIN_CHAT_ID HELIUS_API_KEY POSTGRES_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Missing GitHub secrets: ${missing[*]}. The server is not contacted. Add the secrets listed in docs/runbook.md, then re-run this workflow."
            exit 0
          fi
          if [[ "$DEPLOY_SSH_KEY" != *"PRIVATE KEY"* ]]; then
            echo "DEPLOY_SSH_KEY does not look like a private key." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "DEPLOY_HOST contains unexpected characters." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-z][a-z0-9_-]{0,31}$ ]]; then
            echo "DEPLOY_USER must be a simple Linux username. The bootstrap script creates 'deploy'." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_KNOWN_HOSTS" =~ ssh-ed25519|ssh-rsa|ecdsa-sha2- ]]; then
            echo "DEPLOY_KNOWN_HOSTS does not look like ssh-keyscan output." >&2
            exit 1
          fi
          if [[ ${#POSTGRES_PASSWORD} -lt 8 || ${#TELEGRAM_BOT_TOKEN} -lt 8 || ${#HELIUS_API_KEY} -lt 8 ]]; then
            echo "POSTGRES_PASSWORD, TELEGRAM_BOT_TOKEN, and HELIUS_API_KEY must each be at least 8 characters." >&2
            exit 1
          fi
          if [[ ! "$TELEGRAM_ADMIN_CHAT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "TELEGRAM_ADMIN_CHAT_ID must be the positive integer id of your private chat." >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Write env file and deploy over SSH
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HELIUS_PLAN: ${{ vars.HELIUS_PLAN }}
          HELIUS_WS_MODE: ${{ vars.HELIUS_WS_MODE }}
          HELIUS_MONTHLY_CREDITS: ${{ vars.HELIUS_MONTHLY_CREDITS }}
          INGEST_MODE: ${{ vars.INGEST_MODE }}
          INGEST_VENUES: ${{ vars.INGEST_VENUES }}
          BSC_WSS_URL: ${{ secrets.BSC_WSS_URL || vars.BSC_WSS_URL }}
          X_MENTION_SOURCE: ${{ vars.X_MENTION_SOURCE }}
          WALLET_MAX_WALLETS: ${{ vars.WALLET_MAX_WALLETS }}
          WALLET_CREDIT_BUDGET_PCT: ${{ vars.WALLET_CREDIT_BUDGET_PCT }}
          WALLET_BACKFILL_BUYS: ${{ vars.WALLET_BACKFILL_BUYS }}
          WALLET_BACKFILL_CREDIT_CAP: ${{ vars.WALLET_BACKFILL_CREDIT_CAP }}
          WALLET_BACKFILL_RUN_CREDITS: ${{ vars.WALLET_BACKFILL_RUN_CREDITS }}
          WALLET_CHURN_PCT: ${{ vars.WALLET_CHURN_PCT }}
          WALLET_REFRESH_HOURS: ${{ vars.WALLET_REFRESH_HOURS }}
          WALLET_LOSS_AGE_MINUTES: ${{ vars.WALLET_LOSS_AGE_MINUTES }}
          WALLET_LOSS_AGE_METEORA_MINUTES: ${{ vars.WALLET_LOSS_AGE_METEORA_MINUTES }}
          WALLET_MIN_ENTRIES: ${{ vars.WALLET_MIN_ENTRIES }}
          WALLET_MIN_LOSSES: ${{ vars.WALLET_MIN_LOSSES }}
          WALLET_BOT_MAX_ENTRIES: ${{ vars.WALLET_BOT_MAX_ENTRIES }}
          WALLET_BACKFILL_FAIL_LIMIT: ${{ vars.WALLET_BACKFILL_FAIL_LIMIT }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          known_file="$(mktemp)"
          env_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_file" "$env_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\\n/\n/g' > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\\n/\n/g' > "$known_file"
          chmod 600 "$key_file" "$known_file"
          python3 - "$env_file" << 'PY'
          import os, pathlib, sys, urllib.parse
          destination = pathlib.Path(sys.argv[1])
          password = os.environ["POSTGRES_PASSWORD"]
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_ADMIN_CHAT_ID"]
          helius = os.environ["HELIUS_API_KEY"]

          def pick(name, default, allowed):
              value = os.environ.get(name, "").strip() or default
              if value not in allowed:
                  raise SystemExit(f"{name} must be one of: {', '.join(sorted(allowed))}")
              return value

          def bsc_url():
              value = os.environ.get("BSC_WSS_URL", "").strip() or "wss://bsc-rpc.publicnode.com"
              if not value.startswith("wss://") and not value.startswith("ws://"):
                  raise SystemExit("BSC_WSS_URL must start with wss://")
              return value

          bsc = bsc_url()

          def venues():
              raw = os.environ.get("INGEST_VENUES", "").strip() or "pump,launchlab,meteora"
              allowed = {"pump", "launchlab", "meteora"}
              parts = []
              for part in raw.split(","):
                  name = part.strip()
                  if not name:
                      continue
                  if name not in allowed or name in parts:
                      raise SystemExit("INGEST_VENUES must be a comma-separated list of pump, launchlab, meteora")
                  parts.append(name)
              if not parts:
                  raise SystemExit("INGEST_VENUES must list at least one venue")
              return ",".join(parts)

          def wallet_cap():
              raw = os.environ.get("WALLET_MAX_WALLETS", "").strip() or "300"
              if not raw.isdigit() or not 1 <= int(raw) <= 1000:
                  raise SystemExit("WALLET_MAX_WALLETS must be an integer from 1 to 1000")
              return raw

          def wallet_budget():
              raw = os.environ.get("WALLET_CREDIT_BUDGET_PCT", "").strip() or "25"
              if not raw.isdigit() or not 1 <= int(raw) <= 100:
                  raise SystemExit("WALLET_CREDIT_BUDGET_PCT must be an integer from 1 to 100")
              return raw

          def mention_source():
              return pick("X_MENTION_SOURCE", "off", {"fixture", "off"})

          def loss_floor():
              raw = os.environ.get("WALLET_MIN_LOSSES", "").strip() or "1"
              if not raw.isdigit() or int(raw) > 1000:
                  raise SystemExit("WALLET_MIN_LOSSES must be an integer from 0 to 1000")
              return raw

          def churn_pct():
              raw = os.environ.get("WALLET_CHURN_PCT", "").strip() or "20"
              if not raw.isdigit() or int(raw) > 100:
                  raise SystemExit("WALLET_CHURN_PCT must be an integer from 0 to 100")
              return raw

          def bounded(name, default, upper):
              raw = os.environ.get(name, "").strip() or default
              if not raw.isdigit() or not 1 <= int(raw) <= upper:
                  raise SystemExit(f"{name} must be an integer from 1 to {upper}")
              return raw

          def slot_margin():
              raw = os.environ.get("BACKFILL_SLOT_MARGIN", "").strip() or "16"
              if not raw.isdigit() or int(raw) > 10000:
                  raise SystemExit("BACKFILL_SLOT_MARGIN must be an integer from 0 to 10000")
              return raw

          def line(key, value):
              if "\n" in value or "\r" in value or "\x00" in value:
                  raise SystemExit(f"{key} contains a newline or NUL")
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'{key}="{escaped}"'

          user = "fomo"
          database = "fomo"
          url = "postgres://%s:%s@postgres:5432/%s" % (
              user,
              urllib.parse.quote(password, safe=""),
              database,
          )
          text = "\n".join([
              line("NODE_ENV", "production"),
              line("LOG_LEVEL", "info"),
              line("POSTGRES_USER", user),
              line("POSTGRES_PASSWORD", password),
              line("POSTGRES_DB", database),
              line("DATABASE_URL", url),
              line("TELEGRAM_BOT_TOKEN", token),
              line("TELEGRAM_ADMIN_CHAT_ID", chat),
              line("HELIUS_API_KEY", helius),
              line("HELIUS_PLAN", pick("HELIUS_PLAN", "developer", {"developer", "free"})),
              line("HELIUS_MONTHLY_CREDITS", bounded("HELIUS_MONTHLY_CREDITS", "10000000", 1000000000)),
              line("HELIUS_WS_MODE", pick("HELIUS_WS_MODE", "auto", {"auto", "standard", "enhanced"})),
              line("INGEST_MODE", pick("INGEST_MODE", "dry-run", {"dry-run", "continuous"})),
              line("INGEST_VENUE", pick("INGEST_VENUE", "pump", {"pump", "meteora"})),
              line("INGEST_VENUES", venues()),
              line("BSC_WSS_URL", bsc),
              line("WALLET_MAX_WALLETS", wallet_cap()),
              line("WALLET_CREDIT_BUDGET_PCT", wallet_budget()),
              line("X_MENTION_SOURCE", mention_source()),
              line("WALLET_BACKFILL_BUYS", bounded("WALLET_BACKFILL_BUYS", "50", 500)),
              line("WALLET_BACKFILL_CREDIT_CAP", bounded("WALLET_BACKFILL_CREDIT_CAP", "200000", 100000000)),
              line("WALLET_BACKFILL_RUN_CREDITS", bounded("WALLET_BACKFILL_RUN_CREDITS", "10000", 100000000)),
              line("WALLET_CHURN_PCT", churn_pct()),
              line("WALLET_REFRESH_HOURS", bounded("WALLET_REFRESH_HOURS", "4", 168)),
              line("WALLET_LOSS_AGE_MINUTES", bounded("WALLET_LOSS_AGE_MINUTES", "120", 10080)),
              line("WALLET_LOSS_AGE_METEORA_MINUTES", bounded("WALLET_LOSS_AGE_METEORA_MINUTES", "60", 10080)),
              line("WALLET_MIN_ENTRIES", bounded("WALLET_MIN_ENTRIES", "5", 1000)),
              line("WALLET_MIN_LOSSES", loss_floor()),
              line("WALLET_BOT_MAX_ENTRIES", bounded("WALLET_BOT_MAX_ENTRIES", "80", 100000)),
              line("WALLET_BACKFILL_FAIL_LIMIT", bounded("WALLET_BACKFILL_FAIL_LIMIT", "5", 100)),
              line("PUMP_SUBSCRIBE_TRADES", pick("PUMP_SUBSCRIBE_TRADES", "false", {"true", "false"})),
              line("PUMP_SUBSCRIBE_CREATE_POOL", pick("PUMP_SUBSCRIBE_CREATE_POOL", "false", {"true", "false"})),
              line("BACKFILL_SLOT_MARGIN", slot_margin()),
              line("THRESHOLDS_PATH", "/app/config/thresholds.yaml"),
          ]) + "\n"
          destination.write_text(text, encoding="utf-8")
          PY
          ssh_base=(
            ssh
            -i "$key_file"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_file}"
            -o ConnectTimeout=20
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          "${ssh_base[@]}" "$target" "umask 077; test -d /opt/fomo-copilot/.git; cat > /opt/fomo-copilot/.env.incoming" < "$env_file"
          "${ssh_base[@]}" "$target" bash -s << 'REMOTE'
          set -euo pipefail
          cd /opt/fomo-copilot
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          test -f .env.incoming
          mv .env.incoming .env
          chmod 600 .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d --build
          docker image prune -f
          REMOTE
