# Postgres is on the compose network only. No service publishes a host port.
# Apps still have outbound access for Telegram (and, in later phases, Helius).
# Do not add a ports section.

name: fomo-copilot

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    restart: unless-stopped
    # Only the database settings. The app env file also holds Helius and Telegram
    # keys; mounting that file here recreates this container whenever those change.
    # The named volume below is unchanged, so existing data stays in place.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ingestor:
    build:
      context: ..
      dockerfile: apps/ingestor/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Paper trading and Telegram alerts stay off unless the deploy flag
  # ENABLE_PAPER=true is set. `docker compose up` does not start this profile.
  screener:
    profiles: ["paper"]
    build:
      context: ..
      dockerfile: apps/screener/Dockerfile
    restart: "no"
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot recall audit. `docker compose up` does not start it.
  # Cron runs: docker compose --env-file .env -f infra/docker-compose.yml --profile audit run --rm audit
  audit:
    profiles: ["audit"]
    build:
      context: ..
      dockerfile: apps/ingestor/Dockerfile
    restart: "no"
    command: ["node", "apps/ingestor/dist/audit.js"]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Scheduled exit quotes. Off unless this profile is requested. It does not send alerts.
  outcomes:
    profiles: ["outcomes"]
    build:
      context: ..
      dockerfile: apps/screener/Dockerfile
    command: ["node", "apps/screener/dist/outcomeWorker.js"]
    restart: "no"
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Collection-only shadow. Off unless this profile is requested. No alerts, no trades.
  shadow:
    profiles: ["shadow"]
    build:
      context: ..
      dockerfile: apps/screener/Dockerfile
    command: ["node", "apps/screener/dist/shadowWorker.js"]
    restart: "no"
    # Not the app env. That file holds the Telegram token. This file is not in git.
    env_file:
      - path: ../shadow.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Opt-in restart check. `docker compose up` does not start this profile.
  stack-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: apps/screener/Dockerfile
    command: ["node", "apps/screener/dist/stackRestart.js"]
    restart: "no"
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  alerter:
    profiles: ["paper"]
    build:
      context: ..
      dockerfile: apps/alerter/Dockerfile
    restart: "no"
    env_file:
      - path: ../.env
        required: false
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
