# Postgres is on the compose network only. No service publishes a host port.
# Apps still have outbound access for Telegram (and, in later phases, Helius).
# Do not add a ports section.

name: fomo-copilot

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ingestor:
    build:
      context: ..
      dockerfile: apps/ingestor/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  screener:
    build:
      context: ..
      dockerfile: apps/screener/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  alerter:
    build:
      context: ..
      dockerfile: apps/alerter/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
